<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Приглашение 💌</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }
  .card {
    background: #fff;
    padding: 30px 25px;
    border-radius: 24px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 380px;
    width: 100%;
    z-index: 10;
  }
  h1 { color: #d6336c; font-size: 22px; margin: 0 0 15px; }
  p  { color: #555; font-size: 16px; line-height: 1.5; margin: 0 0 25px; }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    position: relative;
    min-height: 60px;
  }
  button {
    padding: 14px 28px;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  #yes {
    background: #51cf66;
    color: #fff;
    box-shadow: 0 6px 18px rgba(81,207,102,0.4);
  }
  #yes:active { transform: scale(0.95); }
  #no {
    background: #e9ecef;
    color: #495057;
    position: fixed;
    transition: left 0.15s, top 0.15s;
  }
  .done {
    display: none;
    color: #d6336c;
    font-size: 20px;
    font-weight: 700;
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="question">
    <h1>Привет 🌸</h1>
    <p>Ты мне очень нравишься.<br>Хочу пригласить тебя на свидание.<br><b>Пойдёшь?</b></p>
    <div class="buttons">
      <button id="yes">Да ❤️</button>
      <button id="no">Нет</button>
    </div>
  </div>
  <div class="done" id="done">Урааа! 🎉<br>Я самый счастливый!</div>
</div>

<script>
  const noBtn = document.getElementById('no');

  function runAway() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const bw = noBtn.offsetWidth;
    const bh = noBtn.offsetHeight;

    // Случайная позиция, чтобы кнопка не вылезала за экран
    const x = Math.random() * (w - bw - 20) + 10;
    const y = Math.random() * (h - bh - 20) + 10;

    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
  }

  // Ставим кнопку в случайное место сразу при загрузке
  window.addEventListener('load', () => {
    // небольшая задержка, чтобы размеры посчитались корректно
    setTimeout(runAway, 50);
  });

  // Убегает при наведении (ПК) и при касании (телефон)
  noBtn.addEventListener('mouseover', runAway);
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    runAway();
  });
  // На случай клика — тоже убегает
  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    runAway();
  });

  // Нажатие "Да"
  document.getElementById('yes').addEventListener('click', () => {
    document.getElementById('question').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    noBtn.style.display = 'none';
  });
</script>

</body>
</html>
