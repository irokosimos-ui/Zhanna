<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приглашение на свидание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fce4ec; /* Нежно-розовый фон */
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Чтобы кнопка не создавала скролл */
            position: relative;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 80%;
            z-index: 10;
        }
        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        #yes-btn {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }
        #yes-btn:active {
            transform: scale(0.95);
        }
        #no-btn {
            background-color: #e0e0e0;
            color: #333;
            position: absolute; /* Важно для свободного перемещения */
            transition: all 0.1s ease; /* Быстрая реакция */
        }
        .success-message {
            display: none;
            color: #4caf50;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1>Привет! 👋</h1>
        <p>Ты мне очень нравишься. Я бы очень хотел пригласить тебя на свидание. Пойдем?</p>
        <div class="buttons">
            <button id="yes-btn" onclick="sayYes()">Да! ❤️</button>
            <button id="no-btn">Нет 😔</button>
        </div>
        <div class="success-message" id="success-msg">Ура! Я самый счастливый! 🎉</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        const noBtn = document.getElementById('no-btn');
        
        // Функция убегания
        function moveButton() {
            // Получаем размеры окна и кнопки
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Вычисляем случайные координаты, чтобы кнопка не вылетела за экран
            const randomX = Math.floor(Math.random() * (windowWidth - btnWidth));
            const randomY = Math.floor(Math.random() * (windowHeight - btnHeight));

            // Применяем координаты
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // События для ПК (наведение мыши) и мобильных (касание)
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Отменяем клик
            moveButton();
        });

        // Обработка нажатия "Да"
        function sayYes() {
            document.querySelector('.buttons').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            
            // Отправляем данные в бота (если нужно)
            tg.sendData(JSON.stringify({answer: "yes"}));
            
            // Можно закрыть приложение через 3 секунды
            setTimeout(() => {
                tg.close();
            }, 3000);
        }
    </script>
</body>
</html>
